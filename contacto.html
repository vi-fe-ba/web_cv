    <main class="contenedor">
      <section>
        <h2>Formulario de contacto</h2>
        <p>
          Si quieres contactar conmigo deja tu información abajo y un breve
          mensaje y me pondre en contacto contigo lo antes posible
        </p>

        <form action="enviado.html" method="get">
          <label>Nombre:</label><br />
          <input type="text" name="nombre" required /><br /><br />

          <label>Email:</label><br />
          <input type="email" name="email" required /><br /><br />

          <label>Mensaje:</label><br />
          <textarea name="mensaje" required></textarea><br /><br />

          <button type="submit">Enviar</button>
        </form>
      </section>
    </main>
